name: notifly_flutter_ios

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/notifly_flutter_ios.yaml"
      - "notifly_flutter_ios/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/notifly_flutter_ios.yaml"
      - "notifly_flutter_ios/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifly_flutter_ios
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v3

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.10.0
          cache: true

      - name: 🔗 Override Local Dependencies
        run: |
          cat > pubspec_overrides.yaml << 'EOF'
          dependency_overrides:
            notifly_flutter_platform_interface:
              path: ../notifly_flutter_platform_interface
          EOF

      - name: 📦 Install Dependencies
        run: |
          dart --disable-analytics
          flutter --disable-telemetry
          flutter pub get

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed lib test

      - name: 🕵️ Analyze
        run: flutter analyze lib test

      - name: 🧪 Run Tests
        run: flutter test --coverage --test-randomize-ordering-seed random

